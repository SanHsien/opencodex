name: Service lifecycle

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/service.ts"
      # The service implementation is the src/service/ directory; src/service.ts is only
      # the pre-restructure compat facade. The desktop shell packages and launches the
      # service, so its changes carry lifecycle evidence too.
      - "src/service/**"
      - "desktop/**"
      # Keep in sync with the release.yml service-gate regex (release.yml "Require
      # successful Cross-platform CI" step). src/cli.ts is the pre-restructure compat
      # stub that durable launchers still execute.
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/lib/bun-runtime.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
      # release.yml gates on THIS workflow having run for the release SHA. A release-branch
      # commit that touches only release.yml (e.g. the v2.40.0 permissions carry, #3263/#3264)
      # produced no run and the gate dead-ended until a manual dispatch.
      - ".github/workflows/release.yml"
  push:
    # Release lines only (no dev: the Windows leg runs on dev by manual
    # workflow_dispatch). Pull requests run no leg (the Linux and macOS legs were
    # removed from this fork). main and preview
    # must stay: release.yml needs a successful push run for the exact release
    # SHA, and scripts/release.ts only releases from main or preview. Without a
    # branch filter every feature-branch push would re-run the Windows leg.
    branches: [main, preview]
    paths:
      - "src/service.ts"
      # Keep in sync with the release.yml service-gate regex (see above).
      - "src/service/**"
      - "desktop/**"
      # Keep in sync with the release.yml service-gate regex (see above).
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/lib/bun-runtime.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
      # release.yml gates on THIS workflow having run for the release SHA. A release-branch
      # commit that touches only release.yml (e.g. the v2.40.0 permissions carry, #3263/#3264)
      # produced no run and the gate dead-ended until a manual dispatch.
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-schtasks:
    # Windows runs on manual dispatch and main/preview push; never on pull requests.
    if: github.repository == 'lidge-jun/opencodex' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-project-bun

      - run: bun install --frozen-lockfile

      - name: Write minimal config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.opencodex" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.opencodex\config.json" -Value '{"port":10199,"providers":{}}'

      - name: Install service
        shell: pwsh
        run: bun run src/cli/index.ts service install

      - name: Verify scheduled task is healthy
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -eq "Running" -and $healthy) {
              $ready = $true
              break
            }
            Write-Host "waiting for scheduled task health ($attempt/20)"
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task did not become healthy"
          }

      - name: ocx stop should end the task
        shell: pwsh
        run: |
          bun run src/cli/index.ts stop
          $stopped = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -ne "Running" -and -not $healthy) {
              $stopped = $true
              break
            }
            Write-Host "waiting for scheduled task stop ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or health endpoint survived ocx stop"
          }

      - name: Uninstall service
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          bun run src/cli/index.ts service uninstall
          $removed = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -eq $task -and -not $healthy) {
              $removed = $true
              break
            }
            Write-Host "waiting for scheduled task uninstall cleanup ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $removed) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or proxy survived uninstall"
          }
