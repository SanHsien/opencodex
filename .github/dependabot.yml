version: 2
updates:
  # 不幫上游 bun.lock / package.json 開 npm Dependabot：上游幾乎每天發版，
  # lockfile PR 會跟 merge 持續打架。本線只看 workflow 釘住的 actions。
  #
  # 同理，本 repo **沒有**其他 repo 那支每月的依賴新鮮度檢查：那支比對的是
  # 「本線自己宣告的下限 vs 現行版」，而這裡的 package.json 屬於上游、由上游
  # 每天推進，fork 不維護那些宣告，比對出來的落差不是本線該處理的事。
  # fleet-waiver: freshness -- package.json 屬上游且由上游每天推進，本線不維護那些宣告
  # fork 自己擁有的依賴面只有 workflow 的 action pin，已由下面這條看著。
  #
  # 不加 `package-ecosystem: "bun"`：GitHub 官方支援表（2026-10-24 查）Bun 只支援
  # version updates，不支援 security updates；repo 設定的 security updates 遇到
  # bun.lock 一律走 npm_and_yarn 並報「Bun is misconfigured」，加 bun 條目也修不好。
  # 處理方式見 docs/fork/DECISIONS.md 2026-10-24 條目。
  # fleet-waiver: security_fixes -- 自動安全修正遇 bun.lock 一律失敗（Bun 不支援 security updates）；Cargo.lock 警示由維護者逐筆處理（見 DECISIONS.md 2026-10-28）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
